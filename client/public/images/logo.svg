<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg-glass" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b38" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="rim-aurora" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="48%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="prism-left" x1="13" y1="11" x2="27" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="55%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="prism-right" x1="18" y1="14" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ring-glow" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="core-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sleek squircle glass container -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="13" fill="url(#bg-glass)" stroke="url(#rim-aurora)" stroke-width="1.75" />

  <!-- Top glass specular sheen -->
  <path d="M 6 14 C 6 8.5 10.5 4.5 16 4.5 H 32 C 37.5 4.5 42 8.5 42 14 C 31 11.5 17 11.5 6 14 Z" fill="#ffffff" fill-opacity="0.09" />

  <!-- Outer orbital energy ring -->
  <circle cx="24" cy="24" r="15.5" stroke="url(#ring-glow)" stroke-width="1.4" stroke-dasharray="18 7" stroke-linecap="round" />

  <!-- Ambient center plasma glow -->
  <circle cx="25" cy="24" r="12" fill="url(#core-flare)" />

  <!-- Left crimson-violet dimensional wing (stylized D spine) -->
  <path
    d="M 15.5 13.2 C 15.5 11.9 17.0 11.1 18.1 11.8 L 25.4 16.4 L 20.5 24 L 25.4 31.6 L 18.1 36.2 C 17.0 36.9 15.5 36.1 15.5 34.8 V 13.2 Z"
    fill="url(#prism-left)"
  />

  <!-- Right cyan-white faceted play prism arrow -->
  <path
    d="M 21.2 14.4 L 34.6 22.5 C 35.8 23.2 35.8 24.8 34.6 25.5 L 21.2 33.6 L 25.8 24 L 21.2 14.4 Z"
    fill="url(#prism-right)"
  />

  <!-- Razor-sharp central energy core diamond -->
  <polygon points="21.5,24 25.2,21.5 29.5,24 25.2,26.5" fill="#ffffff" />
</svg>
